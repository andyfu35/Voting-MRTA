name: Run Voting-MRTA Experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run packet-loss experiment
        run: python run_experiment.py

      - name: Run retransmission experiment
        run: python run_retransmission_experiment.py

      - name: Run voting algorithm comparison
        run: python run_algorithm_experiment.py

      - name: Verify generated outputs
        run: |
          test -f results/data/raw_results.csv
          test -f results/data/summary_results.csv
          test -f results/figures/winner_preservation_rate.png
          test -f results/figures/optimal_win_rate.png
          test -f results/figures/average_regret.png
          test -f results/figures/tie_rate.png
          test -f results/figures/packet_loss_validation.png
          test -f results/retransmission/data/retransmission_raw_results.csv
          test -f results/retransmission/data/retransmission_summary_results.csv
          test -f results/retransmission/data/retransmission_by_attempt.csv
          test -f results/retransmission/figures/retransmission_winner_preservation_rate.png
          test -f results/retransmission/figures/retransmission_optimal_win_rate.png
          test -f results/retransmission/figures/retransmission_average_regret.png
          test -f results/retransmission/figures/retransmission_tie_rate.png
          test -f results/retransmission/figures/retransmission_effective_loss_rate.png
          test -f results/retransmission/figures/retransmission_overhead.png
          test -f results/retransmission/figures/retransmission_robot_failure_validation.png
          test -f results/algorithms/data/algorithm_raw_results.csv
          test -f results/algorithms/data/algorithm_summary_results.csv
          test -f results/algorithms/data/algorithm_by_method.csv
          test -f results/algorithms/figures/algorithm_optimal_win_rate.png
          test -f results/algorithms/figures/algorithm_full_vote_optimal_win_rate.png
          test -f results/algorithms/figures/algorithm_average_regret.png
          test -f results/algorithms/figures/algorithm_winner_preservation_rate.png
          test -f results/algorithms/figures/algorithm_tie_rate.png
          test -f results/algorithms/figures/algorithm_method_summary.png

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: voting-mrta-results
          path: |
            results/data/*.csv
            results/figures/*.png
            results/retransmission/data/*.csv
            results/retransmission/figures/*.png
            results/algorithms/data/*.csv
            results/algorithms/figures/*.png
          if-no-files-found: error
