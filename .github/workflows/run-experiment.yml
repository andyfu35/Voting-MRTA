name: Run Voting-MRTA Experiment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run packet-loss experiment
        run: python run_experiment.py

      - name: Run retransmission experiment
        run: python run_retransmission_experiment.py

      - name: Run voting algorithm comparison
        run: python run_algorithm_experiment.py

      - name: Run multi-algorithm voting experiment
        run: python run_multi_algorithm_experiment.py

      - name: Run adaptive context-aware voting experiment
        run: python run_adaptive_voting_experiment.py

      - name: Run adaptive near-optimal and top-k quality analysis
        run: python run_adaptive_quality_analysis.py

      - name: Run constraint-aware multi-task Voting-MRTA experiment
        run: python run_multitask_experiment.py

      - name: Run decentralized quorum Voting-MRTA experiment
        run: python run_decentralized_experiment.py

      - name: Run one-shot route execution simulation
        run: python run_execution_simulation.py

      - name: Verify generated outputs
        run: |
          test -f results/data/raw_results.csv
          test -f results/data/summary_results.csv
          test -f results/figures/winner_preservation_rate.png
          test -f results/figures/optimal_win_rate.png
          test -f results/figures/average_regret.png
          test -f results/figures/tie_rate.png
          test -f results/figures/packet_loss_validation.png
          test -f results/retransmission/data/retransmission_raw_results.csv
          test -f results/retransmission/data/retransmission_summary_results.csv
          test -f results/retransmission/data/retransmission_by_attempt.csv
          test -f results/retransmission/figures/retransmission_winner_preservation_rate.png
          test -f results/retransmission/figures/retransmission_optimal_win_rate.png
          test -f results/retransmission/figures/retransmission_average_regret.png
          test -f results/retransmission/figures/retransmission_tie_rate.png
          test -f results/retransmission/figures/retransmission_effective_loss_rate.png
          test -f results/retransmission/figures/retransmission_overhead.png
          test -f results/retransmission/figures/retransmission_robot_failure_validation.png
          test -f results/algorithms/data/algorithm_raw_results.csv
          test -f results/algorithms/data/algorithm_summary_results.csv
          test -f results/algorithms/data/algorithm_by_method.csv
          test -f results/algorithms/figures/algorithm_optimal_win_rate.png
          test -f results/algorithms/figures/algorithm_full_vote_optimal_win_rate.png
          test -f results/algorithms/figures/algorithm_average_regret.png
          test -f results/algorithms/figures/algorithm_winner_preservation_rate.png
          test -f results/algorithms/figures/algorithm_tie_rate.png
          test -f results/algorithms/figures/algorithm_method_summary.png
          test -f results/multi_algorithm/data/multi_algorithm_raw_results.csv
          test -f results/multi_algorithm/data/multi_algorithm_summary_results.csv
          test -f results/multi_algorithm/data/multi_algorithm_by_strategy.csv
          test -f results/multi_algorithm/figures/multi_algorithm_optimal_win_rate.png
          test -f results/multi_algorithm/figures/multi_algorithm_average_regret.png
          test -f results/multi_algorithm/figures/multi_algorithm_tie_rate.png
          test -f results/multi_algorithm/figures/multi_algorithm_winner_preservation_rate.png
          test -f results/multi_algorithm/figures/multi_algorithm_strategy_summary.png
          test -f results/multi_algorithm/figures/multi_algorithm_gain_vs_components.png
          test -f results/adaptive/data/adaptive_raw_results.csv
          test -f results/adaptive/data/adaptive_summary_results.csv
          test -f results/adaptive/data/adaptive_by_strategy.csv
          test -f results/adaptive/data/adaptive_expert_weights.csv
          test -f results/adaptive/figures/adaptive_overall_optimal_win_rate.png
          test -f results/adaptive/figures/adaptive_average_regret.png
          test -f results/adaptive/figures/adaptive_by_scenario.png
          test -f results/adaptive/figures/adaptive_strategy_summary.png
          test -f results/adaptive/figures/adaptive_expert_weights.png
          test -f results/adaptive/figures/adaptive_gain_vs_fixed_expert.png
          test -f results/adaptive_quality/data/adaptive_quality_raw_results.csv
          test -f results/adaptive_quality/data/adaptive_quality_summary_results.csv
          test -f results/adaptive_quality/data/adaptive_quality_by_strategy.csv
          test -f results/adaptive_quality/figures/adaptive_near_optimal_rate.png
          test -f results/adaptive_quality/figures/adaptive_top_k_rate.png
          test -f results/multitask/data/multitask_raw_results.csv
          test -f results/multitask/data/multitask_summary_results.csv
          test -f results/multitask/data/multitask_by_method.csv
          test -f results/multitask/figures/multitask_optimality_gap.png
          test -f results/multitask/figures/multitask_near_optimal_rate.png
          test -f results/multitask/figures/multitask_by_load_ratio.png
          test -f results/multitask/figures/multitask_independent_conflict_rate.png
          test -f results/multitask/figures/multitask_method_summary.png
          test -f results/decentralized/data/decentralized_raw_results.csv
          test -f results/decentralized/data/decentralized_summary_results.csv
          test -f results/decentralized/data/decentralized_by_quorum.csv
          test -f results/decentralized/figures/decentralized_modal_agreement_rate.png
          test -f results/decentralized/figures/decentralized_strict_vs_quorum.png
          test -f results/decentralized/figures/decentralized_safe_commit_rate.png
          test -f results/decentralized/figures/decentralized_split_brain_rate.png
          test -f results/decentralized/figures/decentralized_optimality_gap.png
          test -f results/decentralized/figures/decentralized_message_delivery_rate.png
          test -f results/execution/data/execution_raw_results.csv
          test -f results/execution/data/execution_summary_results.csv
          test -f results/execution/data/execution_by_method.csv
          test -f results/execution/figures/execution_task_completion_rate.png
          test -f results/execution/figures/execution_mission_success_rate.png
          test -f results/execution/figures/execution_eta_error.png
          test -f results/execution/figures/execution_duplicate_task_rate.png
          test -f results/execution/figures/execution_unexecuted_task_rate.png
          test -f results/execution/figures/execution_actual_makespan.png
          test -f results/execution/figures/execution_energy_consumption.png
          test -f results/execution/figures/execution_safe_commit_rate.png

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: voting-mrta-results
          path: |
            results/data/*.csv
            results/figures/*.png
            results/retransmission/data/*.csv
            results/retransmission/figures/*.png
            results/algorithms/data/*.csv
            results/algorithms/figures/*.png
            results/multi_algorithm/data/*.csv
            results/multi_algorithm/figures/*.png
            results/adaptive/data/*.csv
            results/adaptive/figures/*.png
            results/adaptive_quality/data/*.csv
            results/adaptive_quality/figures/*.png
            results/multitask/data/*.csv
            results/multitask/figures/*.png
            results/decentralized/data/*.csv
            results/decentralized/figures/*.png
            results/execution/data/*.csv
            results/execution/figures/*.png
          if-no-files-found: error
